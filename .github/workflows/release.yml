name: release

# Cada push para main é uma candidata a release — o job validate força
# CHANGELOG.md existente + bump presente no commit + sync package.json;
# só então build ×3 (win/mac/linux) e publicação no GitHub Releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: check
        run: node scripts/check-release.mjs --before "${{ github.event.before }}" --after "${{ github.sha }}"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: cache electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - run: npm run dist:server
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # v1 sem assinatura: pula descoberta automática de certificado no macOS/Windows
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: zip portable (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path 'release/win-unpacked/*' `
            -DestinationPath "release/revai-platform-${{ needs.validate.outputs.version }}-portable-win-x64.zip" -Force
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.zip

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: extrai notas da seção do CHANGELOG
        run: node scripts/check-release.mjs --notes "${{ needs.validate.outputs.version }}" > notes.md
      - name: cria/atualiza release v${{ needs.validate.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md
          gh release upload "v$VERSION" "artifacts/**/*" --clobber
