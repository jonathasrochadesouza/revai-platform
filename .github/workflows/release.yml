name: release

# Cada push para main é uma candidata a release — o job validate força
# CHANGELOG.md existente + bump presente no commit + sync package.json;
# só então build ×3 (win/mac/linux) e publicação no GitHub Releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: check
        run: node scripts/check-release.mjs --before "${{ github.event.before }}" --after "${{ github.sha }}"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: cache electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - run: npm run dist:server
      - name: build e sobe assets no draft
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          # v1 sem assinatura: pula descoberta de certificado; o publisher nativo
          # do electron-builder cria/reusa o draft de v*, sobe os assets com retry
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}
      - name: zip portable + upload
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          Compress-Archive -Path 'release/win-unpacked/*' `
            -DestinationPath "release/revai-platform-$env:VERSION-portable-win-x64.zip" -Force
          # o draft pode demorar a aparecer a nível de API; aguarda antes do upload
          for ($i = 0; $i -lt 20; $i++) {
            gh release view "v$env:VERSION" 2>$null >$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 15
          }
          gh release upload "v$env:VERSION" "release/revai-platform-$env:VERSION-portable-win-x64.zip" --clobber
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.zip

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: aguarda draft e valida assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for i in $(seq 1 40); do
            gh release view "v$VERSION" >/dev/null 2>&1 && break
            echo "waiting draft v$VERSION..."
            sleep 15
          done
          gh release view "v$VERSION" >/dev/null
          COUNT=$(gh release view "v$VERSION" --json assets -q '.assets | length')
          echo "assets=$COUNT"
          if [ "$COUNT" -lt 8 ]; then
            echo "::error::Release v$VERSION com poucos assets ($COUNT < 8) — build incompleta?"
            exit 1
          fi
      - name: extrai notas do CHANGELOG e publica
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node scripts/check-release.mjs --notes "$VERSION" > notes.md
          gh release edit "v$VERSION" --notes-file notes.md --draft=false --latest
