<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVAI · Code Review</title>
    <style>
        /* ══════════════════════════════════════════════════════════════════
           Design system: Carrot UI (CodeRabbit) — design.coderabbit.ai
           Tokens extracted from the official stylesheet; components recreated
           per the docs specs (PageLayout, Sidebar, Review Comment,
           Alert, Card, Badge, Button, Filter, Status Dot, Code Block, Toast).
           ══════════════════════════════════════════════════════════════════ */
        :root, [data-theme="light"] {
            --color-cui-mauve-1: oklch(99.4% .002 305);
            --color-cui-mauve-2: oklch(98.2% .0035 305);
            --color-cui-mauve-3: oklch(95.6% .0056 305);
            --color-cui-mauve-4: oklch(93.1% .0084 305);
            --color-cui-mauve-5: oklch(91% .0098 305);
            --color-cui-mauve-6: oklch(88.5% .0112 305);
            --color-cui-mauve-7: oklch(85.1% .0126 305);
            --color-cui-mauve-8: oklch(79.1% .014 305);
            --color-cui-mauve-9: oklch(55% .0154 305);
            --color-cui-mauve-10: oklch(50% .0161 305);
            --color-cui-mauve-11: oklch(44% .0154 305);
            --color-cui-mauve-12: oklch(24.3% .0098 305);

            --color-cui-cr-orange-1: #fefcfb;
            --color-cui-cr-orange-2: #fff7ed;
            --color-cui-cr-orange-3: #ffead5;
            --color-cui-cr-orange-4: #ffdcc3;
            --color-cui-cr-orange-9: #ff570a;
            --color-cui-cr-orange-10: #ef4f00;
            --color-cui-cr-orange-11: #a03e00;
            --color-cui-cr-orange-12: #582d1d;

            --color-cui-red-3: #feeaed;
            --color-cui-red-9: #e54666;
            --color-cui-red-10: #dc3b5d;
            --color-cui-red-11: #ca244d;

            --color-cui-amber-3: #fff7c2;
            --color-cui-amber-9: #ffc53d;
            --color-cui-amber-11: #ab6400;

            --color-cui-secondary-3: oklch(95% .035 163);
            --color-cui-secondary-9: oklch(81.5% .155 163);
            --color-cui-secondary-11: oklch(55% .13 163);
            --color-cui-secondary-12: oklch(28% .06 163);

            --color-cui-cobalt-3: oklch(95% .028 260);
            --color-cui-cobalt-9: oklch(42.84% .172 259.7);
            --color-cui-cobalt-11: oklch(36% .145 260);

            --color-cui-tertiary-3: oklch(95.5% .035 272);
            --color-cui-tertiary-9: oklch(63.8% .177 272);
            --color-cui-tertiary-11: oklch(50% .18 272);

            --background-color-cui-base-0: var(--color-cui-mauve-4);
            --background-color-cui-base-1: var(--color-cui-mauve-2);
            --background-color-cui-base-2: var(--color-cui-mauve-1);
            --background-color-cui-tint-mauve: oklch(.243 .0098 305 / .1);
            --background-color-cui-subtle: var(--background-color-cui-tint-mauve);
            --background-color-cui-inverse: oklch(28% .005 55);
            --background-color-cui-accent: var(--color-cui-cr-orange-9);
            --background-color-cui-accent-subtle: var(--color-cui-cr-orange-3);
            --background-color-cui-accent-strong: var(--color-cui-cr-orange-10);
            --background-color-cui-danger-subtle: var(--color-cui-red-3);
            --background-color-cui-warn-subtle: var(--color-cui-amber-3);
            --background-color-cui-success-subtle: var(--color-cui-secondary-3);
            --background-color-cui-cobalt-subtle: var(--color-cui-cobalt-3);

            --text-color-cui-primary: var(--color-cui-mauve-12);
            --text-color-cui-secondary: var(--color-cui-mauve-11);
            --text-color-cui-tertiary: var(--color-cui-mauve-9);
            --text-color-cui-inverse: var(--color-cui-mauve-1);
            --text-color-cui-accent: var(--color-cui-cr-orange-11);
            --text-color-cui-accent-on: oklch(99% 0 0);
            --text-color-cui-danger: var(--color-cui-red-11);
            --text-color-cui-warn: #ad4c00;
            --text-color-cui-success: var(--color-cui-secondary-11);
            --text-color-cui-cobalt: var(--color-cui-cobalt-11);

            --border-color-cui-neutral: var(--color-cui-mauve-5);
            --border-color-cui-neutral-strong: var(--color-cui-mauve-7);
            --ring-color-cui-focus: var(--color-cui-cr-orange-9);

            --font-cui-sans: "Geist Variable", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            --font-cui-mono: "Hack", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
            --font-weight-normal: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 600;
            --font-weight-bold: 700;
            --text-cui-sm: .75rem;
            --text-cui-sm--line-height: 1rem;
            --text-cui-base: .875rem;
            --text-cui-base--line-height: 1.25rem;
            --text-cui-lg: 1.125rem;
            --text-cui-lg--line-height: 1.75rem;
            --text-cui-xl: 1.5rem;
            --text-cui-xl--line-height: 2rem;
            --tracking-tight: -.025em;

            --radius: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --radius-xl: 12px;
            --ease-cui-out-expo: cubic-bezier(.19, 1, .22, 1);
            --cui-button-highlight-alpha: .4;
            --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, .05);
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, .1), 0 1px 2px -1px rgba(0, 0, 0, .1);

            --font-size: 16px;
        }

        [data-theme="dark"] {
            --color-cui-mauve-1: oklch(17.7% .0084 305);
            --color-cui-mauve-2: oklch(21.3% .0098 305);
            --color-cui-mauve-3: oklch(25.2% .0112 305);
            --color-cui-mauve-4: oklch(28.4% .0126 305);
            --color-cui-mauve-5: oklch(31.2% .014 305);
            --color-cui-mauve-6: oklch(34.8% .0154 305);
            --color-cui-mauve-7: oklch(40.1% .0161 305);
            --color-cui-mauve-8: oklch(48.9% .0168 305);
            --color-cui-mauve-9: oklch(58.5% .0161 305);
            --color-cui-mauve-10: oklch(64% .0154 305);
            --color-cui-mauve-11: oklch(76.7% .0105 305);
            --color-cui-mauve-12: oklch(94.9% .0035 305);

            --color-cui-red-3: #3a141e;
            --color-cui-red-11: #ff949d;
            --color-cui-amber-3: #302008;
            --color-cui-amber-11: #ffca16;
            --color-cui-secondary-3: oklch(24% .045 163);
            --color-cui-secondary-12: oklch(95% .04 163);
            --color-cui-cobalt-3: oklch(24% .045 260);
            --color-cui-cobalt-11: oklch(78% .13 260);
            --color-cui-tertiary-3: oklch(24% .05 272);
            --color-cui-tertiary-11: oklch(78% .155 272);
            --color-cui-cr-orange-3: #331e0b;
            --color-cui-cr-orange-11: #ffa057;
            --color-cui-cr-orange-12: #ffe0c2;

            --background-color-cui-tint-mauve: oklch(.949 .0035 305 / .06);
            --background-color-cui-inverse: oklch(90% .005 55);
            --text-color-cui-warn: var(--color-cui-amber-11);
            --cui-button-highlight-alpha: .12;
            --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, .2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: var(--font-size);
        }

        body {
            font-family: var(--font-cui-sans);
            background: var(--background-color-cui-base-1);
            color: var(--text-color-cui-primary);
            font-size: var(--text-cui-base);
            line-height: var(--text-cui-base--line-height);
            font-weight: var(--font-weight-normal);
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background: var(--background-color-cui-inverse);
            color: var(--text-color-cui-inverse);
        }

        button {
            font-family: inherit;
        }

        button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px var(--ring-color-cui-focus);
        }

        input:focus-visible {
            outline: none;
        }

        .cui-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: color-mix(in srgb, var(--text-color-cui-tertiary) 45%, transparent) transparent;
        }

        .cui-scrollbar:hover {
            scrollbar-color: color-mix(in srgb, var(--text-color-cui-tertiary) 70%, transparent) transparent;
        }

        code {
            font-family: var(--font-cui-mono);
            font-size: .8125rem;
            padding: .125rem .3125rem;
            border-radius: .25rem;
            background: var(--background-color-cui-tint-mauve);
            color: var(--text-color-cui-primary);
        }

        /* ════════════════ PageLayout ════════════════════════════════════ */
        .page-layout {
            display: grid;
            grid-template-columns: 256px minmax(0, 1fr);
            min-height: 100vh;
        }

        .pl-sidebar {
            background: var(--background-color-cui-base-0);
            border-right: 1px solid var(--border-color-cui-neutral);
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            overflow-y: auto;
        }

        .sb-header {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 2rem;
            padding: 0 8px;
            border-radius: var(--radius);
            min-width: 0;
        }

        .sb-avatar {
            width: 24px;
            height: 24px;
            border-radius: var(--radius-md);
            background: var(--background-color-cui-base-2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .brand-logo {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: inherit;
            border: 1px solid var(--border-color-cui-neutral);
        }

        .sb-name {
            font-size: var(--text-cui-sm);
            font-weight: var(--font-weight-medium);
            color: var(--text-color-cui-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sb-plan {
            margin-left: auto;
            flex-shrink: 0;
        }

        .sb-separator {
            height: 1px;
            background: var(--border-color-cui-neutral);
            margin: 2px 4px;
        }

        .sb-section {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sb-label {
            font-size: .6875rem;
            font-weight: var(--font-weight-medium);
            color: var(--text-color-cui-tertiary);
            padding: 4px 8px 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sb-label svg {
            width: 12px;
            height: 12px;
        }

        .sb-row {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 2rem;
            padding: 0 8px;
            border-radius: var(--radius);
            font-size: var(--text-cui-sm);
            color: var(--text-color-cui-secondary);
            min-width: 0;
        }

        .sb-row svg {
            width: 14px;
            height: 14px;
            color: var(--text-color-cui-tertiary);
            flex-shrink: 0;
        }

        .sb-row-label {
            flex-shrink: 0;
        }

        .sb-row-value {
            margin-left: auto;
            color: var(--text-color-cui-primary);
            font-weight: var(--font-weight-medium);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: right;
        }

        .sb-row.mono .sb-row-value {
            font-family: var(--font-cui-mono);
            font-size: .7rem;
            font-weight: var(--font-weight-normal);
        }

        .sb-footer {
            margin-top: auto;
            padding: 8px 4px 2px;
            font-size: .6875rem;
            color: var(--text-color-cui-tertiary);
        }

        /* ── Header / body ── */
        .pl-main {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .pl-header {
            min-height: 2.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 30px;
            border-bottom: 1px solid var(--border-color-cui-neutral);
        }

        .ph-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: var(--text-cui-sm);
            font-weight: var(--font-weight-medium);
            min-width: 0;
        }

        .ph-branch {
            font-family: var(--font-cui-mono);
            font-size: .7rem;
            color: var(--text-color-cui-secondary);
            background: var(--background-color-cui-tint-mauve);
            border-radius: var(--radius);
            padding: 2px 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ph-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .ph-search {
            position: relative;
            display: flex;
            align-items: center;
            width: 260px;
        }

        .sfb-search-icon {
            position: absolute;
            left: 10px;
            width: 14px;
            height: 14px;
            color: var(--text-color-cui-tertiary);
            pointer-events: none;
        }

        .ph-input {
            width: 100%;
            height: 2.25rem;
            padding: 0 30px 0 32px;
            border: 1px solid var(--border-color-cui-neutral);
            border-radius: var(--radius-md);
            background: var(--background-color-cui-base-2);
            color: var(--text-color-cui-primary);
            font-size: var(--text-cui-sm);
            font-family: inherit;
            transition: border-color .15s, box-shadow .15s;
        }

        .ph-input::placeholder {
            color: color-mix(in oklab, currentcolor 50%, transparent);
        }

        .ph-input:focus {
            border-color: var(--ring-color-cui-focus);
            box-shadow: 0 0 0 4px color-mix(in oklab, var(--background-color-cui-accent) 25%, transparent);
        }

        .ph-clear {
            position: absolute;
            right: 7px;
            width: 18px;
            height: 18px;
            border: none;
            background: transparent;
            color: var(--text-color-cui-tertiary);
            border-radius: 999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ph-clear:hover {
            color: var(--text-color-cui-primary);
        }

        .ph-clear svg {
            width: 10px;
            height: 10px;
        }

        .pl-body {
            flex: 1;
            padding: 24px 30px;
        }

        /* ════════════════ Button ════════════════════════════════════════ */
        .cui-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 2.25rem;
            padding: 0 12px;
            border-radius: var(--radius-md);
            font-size: var(--text-cui-sm);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            border: 1px solid var(--border-color-cui-neutral);
            background: transparent;
            color: var(--text-color-cui-primary);
            transition: background .15s cubic-bezier(.4, 0, .2, 1), border-color .15s, color .15s;
            white-space: nowrap;
        }

        .cui-btn:hover {
            background: var(--background-color-cui-tint-mauve);
        }

        .cui-btn.btn-black {
            background: var(--background-color-cui-inverse);
            color: var(--text-color-cui-inverse);
            border-color: transparent;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, calc(var(--cui-button-highlight-alpha) * .6));
        }

        .cui-btn.btn-black:hover {
            background: color-mix(in oklab, var(--background-color-cui-inverse) 86%, var(--text-color-cui-inverse));
        }

        .cui-btn.btn-black:active {
            transform: translateY(1px);
        }

        .cui-btn.btn-transparent {
            border-color: transparent;
            color: var(--text-color-cui-secondary);
        }

        .cui-btn.btn-transparent:hover {
            color: var(--text-color-cui-primary);
        }

        .cui-btn.btn-sm {
            height: 2rem;
            padding: 0 10px;
        }

        .cui-btn.btn-xs {
            height: 1.75rem;
            padding: 0 8px;
            font-size: .7rem;
        }

        .cui-btn:disabled {
            opacity: .5;
            pointer-events: none;
            cursor: not-allowed;
        }

        .cui-btn svg {
            width: 13px;
            height: 13px;
        }

        .cui-btn.copied {
            color: var(--text-color-cui-success);
            border-color: var(--color-cui-secondary-9);
        }

        .icon-btn {
            width: 2.25rem;
            padding: 0;
        }

        /* ════════════════ Badge ═════════════════════════════════════════ */
        .cui-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: var(--text-cui-sm);
            font-weight: var(--font-weight-medium);
            line-height: 1rem;
            padding: 1px 6px;
            border-radius: var(--radius);
            white-space: nowrap;
        }

        .cui-badge.b-border {
            background: transparent;
            border: 1px solid currentColor;
        }

        .cui-badge .b-dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: currentColor;
            flex-shrink: 0;
        }

        .cui-badge svg {
            width: 11px;
            height: 11px;
            flex-shrink: 0;
        }

        .b-neutral {
            background: var(--background-color-cui-tint-mauve);
            color: var(--text-color-cui-primary);
        }

        .b-accent {
            background: var(--background-color-cui-accent-subtle);
            color: var(--text-color-cui-warn);
        }

        .b-danger {
            background: var(--background-color-cui-danger-subtle);
            color: var(--text-color-cui-danger);
        }

        .b-warn {
            background: var(--background-color-cui-warn-subtle);
            color: var(--text-color-cui-warn);
        }

        .b-success {
            background: var(--background-color-cui-success-subtle);
            color: var(--text-color-cui-success);
        }

        /* ════════════════ Status Dot ════════════════════════════════════ */
        .cui-status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            flex-shrink: 0;
        }

        .cui-status-dot.sm {
            width: 6px;
            height: 6px;
        }

        .sd-neutral { background: var(--color-cui-mauve-8); }
        .sd-accent { background: var(--background-color-cui-accent); }
        .sd-danger { background: var(--color-cui-red-9); }
        .sd-warn { background: var(--color-cui-amber-9); }
        .sd-success { background: var(--color-cui-secondary-9); }

        /* ════════════════ Alert (gate) ══════════════════════════════════ */
        .cui-alert {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 16px;
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
        }

        .cui-alert.danger {
            background: var(--background-color-cui-danger-subtle);
        }

        .cui-alert.success {
            background: var(--background-color-cui-success-subtle);
        }

        .cui-alert-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #fff;
        }

        .cui-alert-icon svg {
            width: 15px;
            height: 15px;
        }

        .cui-alert.danger .cui-alert-icon {
            background: var(--color-cui-red-9);
        }

        .cui-alert.success .cui-alert-icon {
            background: var(--color-cui-secondary-9);
            color: oklch(15% .05 163);
        }

        .cui-alert.warn {
            background: var(--background-color-cui-warn-subtle);
        }

        .cui-alert.warn .cui-alert-icon {
            background: var(--color-cui-amber-9);
            color: oklch(15% 0 0);
        }

        .cui-alert-body {
            flex: 1;
            min-width: 0;
        }

        .cui-alert-title {
            font-size: var(--text-cui-base);
            font-weight: var(--font-weight-semibold);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cui-alert-desc {
            margin-top: 3px;
            font-size: var(--text-cui-sm);
            line-height: 1.5;
            color: var(--text-color-cui-secondary);
        }

        .cui-alert.danger .cui-alert-desc strong {
            color: var(--text-color-cui-danger);
            font-weight: var(--font-weight-semibold);
        }

        .cui-alert-chips {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .cui-alert-action {
            align-self: center;
            flex-shrink: 0;
            margin-left: 8px;
        }

        /* Gate mini (sidebar) — caixa auto-explicativa */
        .gate-mini-box {
            margin-top: 4px;
            padding: 8px 10px;
            border-radius: var(--radius-md);
            background: var(--background-color-cui-danger-subtle);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .gate-mini-box.passed {
            background: var(--background-color-cui-success-subtle);
        }

        .gate-mini-box.warn {
            background: var(--background-color-cui-warn-subtle);
        }

        .gate-mini-box.warn .gmb-top strong {
            color: var(--text-color-cui-warn);
        }

        .gmb-top {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: var(--text-cui-sm);
            font-weight: var(--font-weight-medium);
            color: var(--text-color-cui-primary);
        }

        .gmb-top strong {
            margin-left: auto;
            font-size: .68rem;
            font-weight: var(--font-weight-bold);
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .gate-mini-box.failed .gmb-top strong {
            color: var(--text-color-cui-danger);
        }

        .gate-mini-box.passed .gmb-top strong {
            color: var(--text-color-cui-success);
        }

        .gmb-desc {
            font-size: .68rem;
            line-height: 1.5;
            color: var(--text-color-cui-secondary);
            padding-left: 14px;
        }

        /* ════════════════ Card ══════════════════════════════════════════ */
        .cui-card {
            background: var(--background-color-cui-base-2);
            border: 1px solid var(--border-color-cui-neutral);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .cui-card + .cui-card,
        .card-group + .card-group,
        .cui-card + .card-group,
        .card-group + .cui-card {
            margin-top: 12px;
        }

        .cui-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color-cui-neutral);
        }

        .cc-title {
            font-size: var(--text-cui-base);
            font-weight: var(--font-weight-semibold);
        }

        .cc-note {
            margin-left: auto;
            font-size: var(--text-cui-sm);
            color: var(--text-color-cui-tertiary);
        }

        .cc-section {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color-cui-neutral);
        }

        .cc-section:last-child {
            border-bottom: none;
        }

        .cc-avatar {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-md);
            background: var(--background-color-cui-base-2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .walkthrough {
            font-size: var(--text-cui-base);
            line-height: 1.625;
            color: var(--text-color-cui-secondary);
        }

        /* ── Table (official recipe from the Review Comment body) ── */
        .table-wrap {
            overflow: hidden;
            border: 1px solid var(--border-color-cui-neutral);
            border-radius: .375rem;
        }

        .cui-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .8125rem;
        }

        .cui-table th,
        .cui-table td {
            border-top: 1px solid var(--border-color-cui-neutral);
            text-align: left;
            vertical-align: top;
            padding: .5rem .75rem;
        }

        .cui-table tr:first-child th,
        .cui-table tr:first-child td {
            border-top: 0;
        }

        .cui-table th {
            color: var(--text-color-cui-primary);
            background: var(--background-color-cui-tint-mauve);
            font-weight: var(--font-weight-semibold);
            font-size: .6875rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            white-space: nowrap;
        }

        .cui-table td {
            color: var(--text-color-cui-secondary);
        }

        .cui-table tbody tr:nth-child(2n) td {
            background: var(--background-color-cui-tint-mauve);
        }

        .ft-path {
            font-family: var(--font-cui-mono);
            font-size: .7rem;
            white-space: nowrap;
            color: var(--text-color-cui-primary);
        }

        .ft-effort {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            font-size: var(--text-cui-sm);
            color: var(--text-color-cui-secondary);
            white-space: nowrap;
        }

        .ft-effort svg {
            width: 12px;
            height: 12px;
            color: var(--text-color-cui-accent);
        }

        .ft-count {
            font-variant-numeric: tabular-nums;
            font-weight: var(--font-weight-bold);
            color: var(--text-color-cui-primary);
        }

        /* ════════════════ Filter (severidade) ═══════════════════════════ */
        .filter-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 16px 0 12px;
        }

        .filter-label {
            font-size: var(--text-cui-sm);
            font-weight: var(--font-weight-medium);
            color: var(--text-color-cui-tertiary);
        }

        .cui-filter {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 2rem;
            padding: 0 10px;
            border: 1px solid var(--border-color-cui-neutral);
            border-radius: var(--radius-md);
            background: var(--background-color-cui-base-2);
            color: var(--text-color-cui-secondary);
            font-size: var(--text-cui-sm);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: border-color .15s, background .15s, color .15s;
            white-space: nowrap;
        }

        .cui-filter:hover {
            border-color: var(--border-color-cui-neutral-strong);
        }

        .cui-filter.active {
            border-color: var(--color-cui-red-9);
            background: var(--background-color-cui-danger-subtle);
            color: var(--text-color-cui-danger);
        }

        .cui-filter.active.f-minor {
            border-color: var(--color-cui-amber-9);
            background: var(--background-color-cui-warn-subtle);
            color: var(--text-color-cui-warn);
        }

        .cui-filter.active.f-trivial {
            border-color: var(--color-cui-cobalt-9);
            background: var(--background-color-cui-cobalt-subtle);
            color: var(--text-color-cui-cobalt);
        }

        .fp-count {
            font-size: .6875rem;
            font-weight: var(--font-weight-bold);
            color: var(--text-color-cui-tertiary);
            font-variant-numeric: tabular-nums;
        }

        .cui-filter.active .fp-count {
            color: inherit;
        }

        /* ════════════════ Findings head ═════════════════════════════════ */
        .findings-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 22px 0 4px;
            flex-wrap: wrap;
        }

        .findings-head > svg {
            width: 15px;
            height: 15px;
            color: var(--text-color-cui-tertiary);
            flex-shrink: 0;
        }

        .section-title {
            font-size: var(--text-cui-lg);
            line-height: var(--text-cui-lg--line-height);
            font-weight: var(--font-weight-semibold);
            letter-spacing: var(--tracking-tight);
        }

        .results-total-badge {
            font-size: var(--text-cui-sm);
            font-weight: var(--font-weight-bold);
            color: var(--text-color-cui-accent);
            font-variant-numeric: tabular-nums;
        }

        .active-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: var(--text-cui-sm);
            font-weight: var(--font-weight-medium);
            padding: 2px 8px;
            border-radius: var(--radius-md);
            background: var(--background-color-cui-tint-mauve);
            color: var(--text-color-cui-primary);
            border: none;
            cursor: pointer;
        }

        .chip svg {
            width: 10px;
            height: 10px;
        }

        .results-count {
            margin-left: auto;
            font-size: var(--text-cui-sm);
            color: var(--text-color-cui-tertiary);
            font-variant-numeric: tabular-nums;
        }

        /* ════════════════ Grupos ════════════════════════════════════════ */
        .card-group .cui-card-header {
            width: 100%;
            cursor: pointer;
            user-select: none;
            background: transparent;
            border: none;
            text-align: left;
            transition: background .15s;
        }

        .card-group .cui-card-header:hover {
            background: var(--background-color-cui-tint-mauve);
        }

        .g-icon {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .g-icon svg {
            width: 14px;
            height: 14px;
        }

        .card-group.actionable .g-icon {
            background: var(--background-color-cui-danger-subtle);
            color: var(--text-color-cui-danger);
        }

        .card-group.nitpicks .g-icon {
            background: var(--background-color-cui-tint-mauve);
            color: var(--text-color-cui-primary);
        }

        .g-title {
            font-weight: var(--font-weight-semibold);
            font-size: var(--text-cui-base);
            color: var(--text-color-cui-primary);
        }

        .g-sub {
            font-size: .7rem;
            color: var(--text-color-cui-tertiary);
        }

        .g-chevron {
            width: 14px;
            height: 14px;
            color: var(--text-color-cui-tertiary);
            flex-shrink: 0;
            transition: transform .2s var(--ease-cui-out-expo);
        }

        .cui-card-header [data-group-count] {
            margin-left: auto;
            display: inline-flex;
            flex-shrink: 0;
        }

        .card-group:not(.open) .g-chevron {
            transform: rotate(-90deg);
        }

        .group-body {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows .28s var(--ease-cui-out-expo);
        }

        .card-group.open .group-body {
            grid-template-rows: 1fr;
        }

        .group-body-inner {
            overflow: hidden;
        }

        /* ════════════════ Review Comment ════════════════════════════════ */
        .rc-thread {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px 16px 16px;
            border-top: 1px solid var(--border-color-cui-neutral);
        }

        .rc {
            display: flex;
            gap: 10px;
        }

        .rc-gutter {
            flex-shrink: 0;
            position: relative;
            display: flex;
        }

        .rc-thread .rc:not(:last-child) .rc-gutter::after {
            content: "";
            position: absolute;
            top: 36px;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            background: var(--border-color-cui-neutral-strong);
        }

        .rc-avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            background: var(--background-color-cui-base-2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .rc-main {
            flex: 1;
            min-width: 0;
            position: relative;
        }

        .rc-main::before {
            content: "";
            position: absolute;
            left: -5px;
            top: 11px;
            width: 10px;
            height: 10px;
            background: var(--background-color-cui-base-2);
            border-left: 1px solid var(--border-color-cui-neutral);
            border-bottom: 1px solid var(--border-color-cui-neutral);
            transform: rotate(45deg);
        }

        .rc-card {
            background: var(--background-color-cui-base-2);
            border: 1px solid var(--border-color-cui-neutral);
            border-radius: var(--radius-lg);
            overflow: hidden;
            animation: cardIn .22s var(--ease-cui-out-expo) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: none; }
        }

        .rc.resolved .rc-card {
            opacity: .55;
        }

        .rc-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color-cui-neutral);
            flex-wrap: wrap;
            min-width: 0;
        }

        .rc-author {
            font-size: var(--text-cui-sm);
            font-weight: var(--font-weight-semibold);
            color: var(--text-color-cui-primary);
        }

        .rc-meta {
            font-size: .7rem;
            color: var(--text-color-cui-tertiary);
            font-family: var(--font-cui-mono);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .rc-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .rc.resolved .rc-actions {
            padding-right: 5rem;
        }

        .rc-body {
            padding: 10px 12px;
            font-size: var(--text-cui-base);
            color: var(--text-color-cui-secondary);
        }

        .rc-title {
            font-size: var(--text-cui-base);
            font-weight: var(--font-weight-semibold);
            color: var(--text-color-cui-primary);
            margin-bottom: 3px;
        }

        .rc-why {
            margin-top: 8px;
            padding-left: 12px;
            border-left: 2px solid var(--border-color-cui-neutral-strong);
            font-size: var(--text-cui-sm);
            color: var(--text-color-cui-secondary);
        }

        .why-label {
            font-size: .6rem;
            font-weight: var(--font-weight-bold);
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text-color-cui-warn);
            display: block;
            margin-bottom: 2px;
        }

        .rc-resolved-tag {
            position: absolute;
            top: 8px;
            right: 10px;
            z-index: 1;
        }

        .rc-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 8px 12px;
            border-top: 1px solid var(--border-color-cui-neutral);
            flex-wrap: wrap;
        }

        /* ════════════════ Code Block (variant card) ═════════════════════ */
        .cui-code-block {
            background: var(--background-color-cui-base-1);
            border: 1px solid var(--border-color-cui-neutral);
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-top: 10px;
        }

        .cb-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px 5px 12px;
            border-bottom: 1px solid var(--border-color-cui-neutral);
            font-size: .7rem;
            color: var(--text-color-cui-tertiary);
            flex-wrap: wrap;
        }

        .cb-file-info {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-width: 0;
            overflow: hidden;
        }

        .cb-file-info svg {
            width: 12px;
            height: 12px;
            color: var(--text-color-cui-tertiary);
            flex-shrink: 0;
        }

        .cb-filename {
            font-family: var(--font-cui-mono);
            font-size: .68rem;
            font-weight: var(--font-weight-medium);
            color: var(--text-color-cui-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cb-head .cui-btn {
            margin-left: auto;
        }

        .cb-surface {
            background: var(--background-color-cui-base-2);
        }

        .cb-surface pre {
            font-family: var(--font-cui-mono);
            font-size: .8125rem;
            line-height: 1.55;
            padding: .75rem;
            margin: 0;
            overflow-x: auto;
            color: var(--text-color-cui-primary);
        }

        .cb-surface pre code {
            background: transparent;
            padding: 0;
            border-radius: 0;
            font-size: inherit;
        }

        .cb-line {
            display: block;
            white-space: pre;
            padding: 0 12px 0 8px;
        }

        .cb-sign {
            display: inline-block;
            width: 1rem;
            user-select: none;
        }

        .cb-line.del {
            background: color-mix(in oklab, var(--color-cui-red-9) 9%, transparent);
            color: var(--text-color-cui-danger);
        }

        .cb-line.add {
            background: color-mix(in oklab, var(--color-cui-secondary-9) 16%, transparent);
            color: var(--text-color-cui-success);
        }

        .prose-code {
            margin-top: 10px;
        }

        /* ════════════════ Select mobile ═════════════════════════════════ */
        .file-select-wrap {
            display: none;
        }

        .file-select {
            width: 100%;
            height: 2.25rem;
            padding: 0 10px;
            border: 1px solid var(--border-color-cui-neutral);
            border-radius: var(--radius-md);
            background: var(--background-color-cui-base-2);
            color: var(--text-color-cui-primary);
            font-family: inherit;
            font-size: var(--text-cui-sm);
        }

        /* ════════════════ Empty state ═══════════════════════════════════ */
        .empty-state {
            text-align: center;
            padding: 44px 16px;
            background: var(--background-color-cui-base-2);
            border: 1px dashed var(--border-color-cui-neutral-strong);
            border-radius: var(--radius-lg);
            color: var(--text-color-cui-tertiary);
        }

        .empty-state svg {
            width: 40px;
            height: 40px;
            margin-bottom: 8px;
            opacity: .6;
        }

        .empty-title {
            font-size: var(--text-cui-base);
            font-weight: var(--font-weight-semibold);
            color: var(--text-color-cui-primary);
            margin-bottom: 2px;
        }

        .empty-desc {
            font-size: var(--text-cui-sm);
        }

        /* ════════════════ Footer ════════════════════════════════════════ */
        .pl-footer {
            border-top: 1px solid var(--border-color-cui-neutral);
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: .6875rem;
            color: var(--text-color-cui-tertiary);
        }

        /* ════════════════ Toast (.cui-toast) ════════════════════════════ */
        .cui-toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 100;
            background: var(--background-color-cui-base-2);
            border: 1px solid var(--border-color-cui-neutral);
            border-radius: var(--radius-lg);
            padding: 10px 14px;
            box-shadow: var(--shadow-sm), 0 10px 15px -3px rgba(0, 0, 0, .1), 0 4px 6px -4px rgba(0, 0, 0, .1);
            display: flex;
            gap: 10px;
            align-items: center;
            opacity: 0;
            transform: translateY(16px);
            pointer-events: none;
            transition: transform .4s, opacity .4s;
            max-width: 360px;
        }

        .cui-toast[data-visible="true"] {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .cui-toast-icon {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-md);
            background: var(--background-color-cui-accent-subtle);
            color: var(--text-color-cui-warn);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cui-toast-icon svg {
            width: 14px;
            height: 14px;
        }

        .cui-toast-title {
            font-size: var(--text-cui-sm);
            font-weight: var(--font-weight-semibold);
            color: var(--text-color-cui-primary);
        }

        .cui-toast-msg {
            font-size: .7rem;
            color: var(--text-color-cui-tertiary);
            line-height: 1.45;
        }

        @media (prefers-reduced-motion) {
            .cui-toast,
            .rc-card,
            .g-chevron,
            .group-body {
                transition: none !important;
                animation: none !important;
            }
        }

        /* ════════════════ Responsive ════════════════════════════════════ */
        @media (max-width: 1080px) {
            .page-layout {
                grid-template-columns: 1fr;
            }

            .pl-sidebar {
                display: none;
            }

            .file-select-wrap {
                display: block;
                margin-bottom: 16px;
            }
        }

        @media (max-width: 640px) {
            .pl-body {
                padding: 16px;
            }

            .pl-header {
                padding: 8px 16px;
                height: auto;
                min-height: 2.5rem;
                flex-wrap: wrap;
            }

            .ph-actions {
                width: 100%;
                margin-left: 0;
            }

            .ph-search {
                width: 100%;
            }

            .pl-footer {
                padding: 12px 16px;
            }

            .rc-actions {
                width: 100%;
                margin-left: 0;
                padding-left: 0;
            }
        }
    </style>
</head>

    <div id="root"></div>

        const REVIEW_META = /*__REVAI_META__*/;

        function normalizeFinding(f) {
            return Object.assign({}, f, {
                severity: f.severity || PRIORITY_MAP[f.priority] || 'minor',
                category: f.category || 'stability',
                effort: f.effort || 'estimated',
                status: f.status || 'open'
            });
        }

        const findings = REVIEW_DATA
            .map(normalizeFinding)

        const xIconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        const copyIconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
        const checkIconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        const fileIconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>';

        // Official badge: 5 semantic variants, orthogonal border/dot
        function Badge(label, variant, opts) {
            opts = opts || {};
            let cls = 'cui-badge b-' + (variant || 'neutral');
            if (opts.border) cls += ' b-border';
            return '<span class="' + cls + '">' +

        function PageHeader() {

        function renderGateMini() {
            const el = document.getElementById('gate-mini');
            if (!el) return;
            const gate = computeGate();
            const failed = gate.status === 'failed';
            const cls = failed ? 'failed' : (gate.skippedBlockers > 0 ? 'warn' : 'passed');
            const status = failed ? 'Failed' : 'Passed';
            const desc = failed
                ? gate.blockedBy + ' critical finding(s) block approval of this review. Estimated effort to release: ' + gate.effortLabel + '.'
                : (gate.skippedBlockers > 0
                    ? 'Released via skipped blockers — this is not best practice.'
                    : 'Nothing blocks — the review can be approved.');
            el.className = 'gate-mini-box ' + cls;
            el.innerHTML =
                '<div class="gmb-top">' +
                    '<span class="cui-status-dot sm ' + (failed ? 'sd-danger' : (gate.skippedBlockers > 0 ? 'sd-warn' : 'sd-success')) + '"></span>' +
                    '<span>Quality Gate</span>' +
                    '<strong>' + status + '</strong>' +
                '</div>' +
                '<div class="gmb-desc">' + esc(desc) + '</div>';
        }

        // Estimated effort (SonarQube "effort to fix"): sum of open blockers
        const EFFORT_MINUTES = { 'quick-win': 15, estimated: 60, significant: 240 };

        function formatEffort(totalMinutes) {
            if (!totalMinutes) return '0min';
            if (totalMinutes < 60) return '~' + totalMinutes + 'min';
            const h = Math.floor(totalMinutes / 60);
            const m = totalMinutes % 60;
            return m === 0 ? '~' + h + 'h' : '~' + h + 'h' + m;
        }

        function gateEffort() {
            let total = 0;
            findings.forEach(function (f) {
                if (f.status === 'resolved' || state.skipped[f.id]) return;
                if (f.severity === 'critical' || f.severity === 'major') {
                    total += EFFORT_MINUTES[f.effort] || EFFORT_MINUTES.estimated;
                }
            });
            return formatEffort(total);
        }

        function computeGate() {
            const active = findings.filter(function (f) { return f.status !== 'resolved' && !state.skipped[f.id]; });
            const criticalCount = active.filter(function (f) { return f.severity === 'critical'; }).length;
            const securityCount = active.filter(function (f) { return f.category === 'security'; }).length;
            const skippedBlockers = findings.filter(function (f) {
                if (f.status === 'resolved' || !state.skipped[f.id]) return false;
                return f.severity === 'critical' || f.category === 'security';
            }).length;
            const failed = criticalCount > 0;
            const criteria = [];
            if (failed) {
                criteria.push(criticalCount + ' critical finding(s) (max 0)');
                if (securityCount > 0) criteria.push(securityCount + ' security hotspot(s) (max 0)');
            } else if (skippedBlockers > 0) {
                criteria.push(skippedBlockers + ' blocker(s) marked as Skipped');
            } else {
                criteria.push('No blockers in new code');
            }
            criteria.push(active.length + ' open findings in new code');
            return {
                status: failed ? 'failed' : 'passed',
                criteria: criteria,
                skippedBlockers: skippedBlockers,
                blockedBy: criticalCount,
                securityOpen: securityCount,
                actionableOpen: active.filter(function (f) { return f.severity === 'critical' || f.severity === 'major'; }).length,
                effortLabel: gateEffort()
            };
        }

        // Alert (official danger/success/warn variant) — dynamic, self-explanatory gate
        function QualityGate() {
            const gate = computeGate();
            const failed = gate.status === 'failed';
            const violations = [];
            const info = [];
            gate.criteria.forEach(function (c) {
                if (/new code/i.test(c)) info.push(c); else violations.push(c);
            });
            const desc = failed
                ? 'This review is blocked: resolve <strong>' + gate.blockedBy + ' critical finding(s)</strong> to release approval.'
                : (gate.skippedBlockers > 0
                    ? 'Approval released with <strong>' + gate.skippedBlockers + ' blocker(s)</strong> marked as Skipped instead of fixed.'
                    : 'Everything within policy — <strong>the review can be approved</strong>.');
            const chipsHtml = (failed
                ? violations.map(function (c) { return Badge(esc(c), 'danger', { border: true }); }).concat([Badge('Release in ' + gate.effortLabel, 'accent', { border: true })])
                : violations.map(function (c) { return Badge(esc(c), 'warn', { border: true }); })
            ).concat(info.map(function (c) {
                return Badge(esc(c), 'neutral', { border: true });
            })).join('');

            let actionHtml = '';
            if (failed) {
                actionHtml = '<div class="cui-alert-action">' +
                    '<button class="cui-btn btn-black btn-sm" onclick="scrollToResults()" title="Go to the findings blocking the gate">' +
                        icons.target + '<span>Resolve findings</span>' +
                    '</button>' +
                '</div>';
            } else if (gate.skippedBlockers > 0) {
                actionHtml = '<div class="cui-alert-action">' +
                    '<button class="cui-btn btn-black btn-sm" onclick="revealSkipped()" title="View the blockers marked as Skipped">' +
                        icons.ban + '<span>View skipped</span>' +
                    '</button>' +
                '</div>';
            }

            return (
                '<div class="cui-alert ' + (failed ? 'danger' : 'success') + '">' +
                    '<div class="cui-alert-icon">' + (failed ? icons.alertTriangle : icons.shieldCheck) + '</div>' +
                    '<div class="cui-alert-body">' +
                        '<div class="cui-alert-title">Quality Gate' +
                            (failed ? Badge('Failed', 'danger') : Badge('Passed', 'success')) +
                        '</div>' +
                        '<div class="cui-alert-desc">' + desc + '</div>' +
                        '<div class="cui-alert-chips">' + chipsHtml + '</div>' +
                    '</div>' +
                    actionHtml +
                '</div>'
            );
        }

        function SkippedWarning() {
            const gate = computeGate();
            if (gate.status === 'failed' || gate.skippedBlockers === 0) return '';
            return (
                '<div class="cui-alert warn">' +
                    '<div class="cui-alert-icon">' + icons.alertTriangle + '</div>' +
                    '<div class="cui-alert-body">' +
                        '<div class="cui-alert-title">Skipped blockers' + Badge('Attention', 'warn') + '</div>' +
                        '<div class="cui-alert-desc"><strong>' + gate.skippedBlockers + ' blocker(s)</strong> were marked as Skipped instead of fixed. <strong>This is not best practice</strong>: critical and security issues must be resolved before approval, not ignored.</div>' +
                    '</div>' +
                    '<div class="cui-alert-action">' +
                        '<button class="cui-btn btn-sm" onclick="revealSkipped()">' + icons.rotateCcw + '<span>Review skipped</span></button>' +
                    '</div>' +
                '</div>'
            );
        }

        function scrollToGroup(name) {

        function Hero() {
            return (
                '<div class="cui-card hero">' +

        function FileSelect() {
            return (

                    '<select class="file-select" id="file-select" onchange="handleSelectFile(this.value)" aria-label="Filter by file">' +

        function catBadge(f) {
            return Badge(CATEGORY[f.category].label, CATEGORY[f.category].badge, { border: true, icon: catIcon(f.category) });
        }

        function catIcon(category) {
            if (category === 'security') return icons.shield;
            if (category === 'performance') return icons.zap;
            if (category === 'stability') return icons.activity;
            return icons.database;
        }

        function sevBadge(f) {
            return Badge(SEVERITY[f.severity].label, SEVERITY[f.severity].badge, { dot: true });
        }

        function effortBadge(f) {
            return Badge(EFFORT[f.effort] ? EFFORT[f.effort].label : f.effort, 'neutral', { icon: effIcon(f.effort) });
        }

        function effIcon(effort) {
            if (effort === 'quick-win') return icons.zap;
            if (effort === 'significant') return icons.wrench;
            return icons.clock;
        }

        // Code Block (official card variant)
        function CodeBlock(f) {
            const fix = f.proposedFix;
            let lines = [];
            (fix.before || []).forEach(function (l) {
                lines.push('<span class="cb-line del"><span class="cb-sign">-</span>' + esc(l) + '</span>');
            });
            (fix.after || []).forEach(function (l) {
                lines.push('<span class="cb-line add"><span class="cb-sign">+</span>' + esc(l) + '</span>');
            });
            const idx = findings.indexOf(f);
            return (
                '<div class="cui-code-block">' +
                    '<div class="cb-head">' +
                        '<div class="cb-file-info">' + icons.fileDiff + '<span class="cb-filename">Proposed fix · diff · ' + esc(f.file) + ' ' + esc(f.lines || '') + '</span></div>' +
                        '<button class="cui-btn btn-transparent btn-xs" onclick="copyFindingDiff(this,' + idx + ')" aria-label="Copy code">' + copyIconSVG + '<span>Copy</span></button>' +
                    '</div>' +
                    '<div class="cb-surface"><pre>' + lines.join('') + '</pre></div>' +
                '</div>'
            );
        }

        function copyText(text, btn, label, copiedLabel) {
            label = label || 'Copy';
            copiedLabel = copiedLabel || 'Copied!';
            function success() {
                btn.classList.add('copied');
                btn.innerHTML = checkIconSVG + '<span>' + copiedLabel + '</span>';
                setTimeout(function () {
                    btn.classList.remove('copied');
                    btn.innerHTML = copyIconSVG + '<span>' + label + '</span>';
                }, 3000);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(success).catch(function () { fallbackCopy(text, success); });
            } else {
                fallbackCopy(text, success);
            }
        }

        function fallbackCopy(text, success) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            success();
        }

        function copyFindingDiff(btn, idx) {
            const f = findings[idx];
            if (!f) return;
            let text;
            if (f.proposedFix) {
                const parts = [];
                (f.proposedFix.before || []).forEach(function (l) { parts.push('- ' + l); });
                (f.proposedFix.after || []).forEach(function (l) { parts.push('+ ' + l); });
                text = parts.join('\n');
            } else {
                text = f.copilotSummary || '';
            }
            copyText(text, btn, 'Copy', 'Copied!');
        }

        // Copy as a plain-text prompt the user can paste into any agent session
        function plainify(text) {
            let s = String(text || '');
            s = s.replace(/```(\w+)?\n?([\s\S]*?)```/g, function (m, lang, code) {
                return '\n' + code.replace(/^\n/, '').replace(/\n$/, '') + '\n';
            });
            s = s.replace(/\*\*(.*?)\*\*/g, '$1');
            s = s.replace(/`([^`]+)`/g, '$1');
            return s.trim();
        }

        function findingPromptText(f) {
            const parts = [];
            parts.push('Fix the following code review item (REVAI):');
            parts.push('- Item: ' + f.id + ' (#' + f.num + ') — Severity: ' + SEVERITY[f.severity].label + ' (' + CATEGORY[f.category].label + ') — Effort: ' + (EFFORT[f.effort] ? EFFORT[f.effort].label : f.effort));
            parts.push('- File: ' + f.file + ' (lines ' + (f.lines || '?') + ')');
            parts.push('- Problem: ' + f.title);
            parts.push('- Description: ' + plainify(f.description));
            if (f.rationale) parts.push('- Why: ' + plainify(f.rationale));
            if (f.proposedFix) {
                const fixLines = [];
                (f.proposedFix.before || []).forEach(function (l) { fixLines.push('- ' + l); });
                (f.proposedFix.after || []).forEach(function (l) { fixLines.push('+ ' + l); });
                parts.push('- Proposed fix:\n' + fixLines.join('\n'));
            } else if (f.copilotSummary) {
                parts.push('- Current suggestion:\n' + plainify(f.copilotSummary));
            }
            parts.push('- Branch: ' + REVIEW_META.branch);
            parts.push('Apply the smallest possible fix, preserving expected behavior.');
            return parts.join('\n');
        }

        function copyFindingPrompt(btn, idx) {
            const f = findings[idx];
            if (!f) return;
            copyText(findingPromptText(f), btn, 'Copy prompt', 'Copied!');
        }

        // ReviewComment (official structure: gutter + header band + body + footer)
        function FindingCard(f, idx) {
            const resolved = f.status === 'resolved';
            const skipped = !!state.skipped[f.id];
            const dimmed = resolved || skipped;
            return (
                '<div class="rc' + (dimmed ? ' resolved' : '') + '">' +
                    '<div class="rc-gutter">' +
                        '<div class="rc-avatar"><img class="brand-logo" src="' + LOGO_DEFAULT + '" alt="" title="REVAI"></div>' +
                    '</div>' +
                    '<div class="rc-main">' +
                        (resolved ? '<span class="rc-resolved-tag">' + Badge('Resolved', 'success') + '</span>' : '') +
                        (skipped ? '<span class="rc-resolved-tag">' + Badge('Skipped', 'neutral') + '</span>' : '') +
                        '<div class="rc-card">' +
                            '<div class="rc-header">' +
                                '<span class="rc-author">REVAI</span>' +
                                Badge('Bot', 'accent') +
                                '<span class="rc-meta">' + esc(f.file) + ' · ' + esc(f.lines || '') + '</span>' +
                                '<div class="rc-actions">' +
                                    catBadge(f) +
                                    sevBadge(f) +
                                    effortBadge(f) +
                                '</div>' +
                            '</div>' +
                            '<div class="rc-body">' +
                                '<div class="rc-title">' + esc(f.title) + '</div>' +
                                '<div>' + parseMarkdown(f.description || '') + '</div>' +
                                (f.rationale
                                    ? '<div class="rc-why"><span class="why-label">Why</span>' + parseMarkdown(f.rationale) + '</div>'
                                    : '') +
                                (f.proposedFix
                                    ? CodeBlock(f)
                                    : '<div class="prose-code">' + parseMarkdown(f.copilotSummary || '', f.file, f.lines) + '</div>') +
                            '</div>' +
                            '<div class="rc-footer">' +
                                '<button class="cui-btn btn-transparent btn-xs" onclick="copyFindingDiff(this,' + idx + ')">' + copyIconSVG + '<span>Copy ' + (f.proposedFix ? 'diff' : 'code') + '</span></button>' +
                                '<button class="cui-btn btn-transparent btn-xs" onclick="copyFindingPrompt(this,' + idx + ')" title="Copy as a prompt for an agent to fix">' + icons.clipboardList + '<span>Copy prompt</span></button>' +
                                (skipped
                                    ? '<button class="cui-btn btn-xs" onclick="toggleSkip(\'' + f.id + '\')" title="Return the finding to the to-fix list">' + icons.rotateCcw + '<span>Restore</span></button>'
                                    : '<button class="cui-btn btn-xs" onclick="toggleSkip(\'' + f.id + '\')" title="Mark as not viable to change now">' + icons.ban + '<span>Skip</span></button>') +
                                (dimmed ? '' : '<button class="cui-btn btn-black btn-sm" onclick="showFixToast()">' + icons.wand + '<span>Fix</span></button>') +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</div>'
            );
        }

        function groupTitle(name) {
            if (name === 'actionable') return 'Actionable';
            if (name === 'nitpicks') return 'Nitpicks';
            return 'Skipped';
        }

        function GroupHtml(name, open, cardsHtml) {
            return (
                '<div class="card-group cui-card ' + name + (open ? ' open' : '') + '" id="group-' + name + '">' +
                    '<button class="cui-card-header" onclick="toggleGroup(\'' + name + '\')" aria-expanded="' + (open ? 'true' : 'false') + '">' +
                        '<div class="g-icon">' + iconSvg(name) + '</div>' +
                        '<div><div class="g-title">' + groupTitle(name) + '</div>' +
                        '<div class="g-sub">' + esc(subText(name)) + '</div></div>' +
                        '<span data-group-count="' + name + '"></span>' +
                        '<svg class="g-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>' +
                    '</button>' +
                    '<div class="group-body"><div class="group-body-inner">' +
                        '<div class="rc-thread">' + cardsHtml + '</div>' +
                    '</div></div>' +
                '</div>'
            );
        }

        function iconSvg(name) {
            if (name === 'actionable') return icons.alertTriangle;
            if (name === 'nitpicks') return icons.sparkles;
            return icons.ban;
        }

        function subText(name) {
            if (name === 'actionable') return 'Should be resolved before merge';
            if (name === 'nitpicks') return 'Optional — do not block the merge';
            return 'Deemed not viable to change now';
        }

        function EmptyState() {
            return (
                '<div class="empty-state">' +
                    icons.fileText +
                    '<h3 class="empty-title">No findings found</h3>' +
                    '<p class="empty-desc">Adjust the search or the filters to see results.</p>' +
                '</div>'
            );
        }

        function PageFooter() {
            return (
                '<footer class="pl-footer">' +
                    '<span>REVAI · v0.7.2</span>' +
                    '<span>Design system: Carrot UI (CodeRabbit)</span>' +
                '</footer>'
            );
        }

        function toastHtml() {
            return (
                '<div class="cui-toast" id="fix-toast" role="status">' +
                    '<div class="cui-toast-icon">' + icons.wand + '</div>' +
                    '<div><div class="cui-toast-title">Coming soon</div>' +
                    '<div class="cui-toast-msg">The Fix button will apply the proposed fix automatically in a future version.</div></div>' +
                '</div>'
            );
        }

        function matchesSearch(f) {
            const q = state.search.trim().toLowerCase();
            if (!q) return true;
            const hay = (f.title + ' ' + (f.description || '') + ' ' + (f.rationale || '') + ' ' + f.file + ' ' + f.id).toLowerCase();
            return hay.indexOf(q) >= 0;
        }

        let searchTimeout;
        function handleSearch(event) {
            state.search = event.target.value;
            const clearBtn = document.getElementById('sfb-clear-btn');
            if (clearBtn) clearBtn.style.display = state.search ? '' : 'none';
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(function () {
                renderResults();
            }, 150);
        }

        function clearSearch() {
            state.search = '';
            const input = document.getElementById('findings-search');
            if (input) { input.value = ''; input.focus(); }
            const clearBtn = document.getElementById('sfb-clear-btn');
            if (clearBtn) clearBtn.style.display = 'none';
            renderResults();
        }

        function handleSeverityFilter(sev) {
            state.selectedSeverity = sev;
            renderResults();
        }

        function handleFileFilter(file) {
            state.selectedFile = state.selectedFile === file ? null : file;
            const select = document.getElementById('file-select');
            if (select) select.value = state.selectedFile || '';
            renderResults();
        }

        function handleSelectFile(value) {
            state.selectedFile = value || null;
            renderResults();
        }

        const GROUP_STATE_KEYS = { actionable: 'actionableOpen', nitpicks: 'nitpicksOpen', skipped: 'skippedOpen' };

        function toggleGroup(name) {
            const key = GROUP_STATE_KEYS[name];
            if (!key) return;
            state[key] = !state[key];
            const group = document.getElementById('group-' + name);
            if (group) {
                group.classList.toggle('open', state[key]);
                const btn = group.querySelector('.cui-card-header');
                if (btn) btn.setAttribute('aria-expanded', state[key] ? 'true' : 'false');
            }
        }

        let toastTimeout;
        function showToast(title, msg) {
            const toast = document.getElementById('fix-toast');
            if (!toast) return;
            const titleEl = toast.querySelector('.cui-toast-title');
            const msgEl = toast.querySelector('.cui-toast-msg');
            if (titleEl) titleEl.textContent = title;
            if (msgEl) msgEl.textContent = msg;
            toast.setAttribute('data-visible', 'true');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(function () { toast.setAttribute('data-visible', 'false'); }, 3500);
        }

        function showFixToast() {
            showToast('Coming soon', 'The Fix button will apply the proposed fix automatically in a future version.');
        }

        function toggleSkip(id) {
            if (state.skipped[id]) {
                delete state.skipped[id];
                showToast('Finding restored', 'The finding is back on the to-fix list.');
            } else {
                state.skipped[id] = true;
                showToast('Moved to Skipped', 'This finding will not be fixed in this pass.');
            }
            renderResults();
            renderGate();
        }

        function toggleTheme() {
            state.isDark = !state.isDark;
            const theme = state.isDark ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            saveConfig({ theme: theme });
            render();
        }

        function copyCode(btn) {
            const pre = btn.closest('.cui-code-block').querySelector('pre');
            const text = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText;
            copyText(text, btn, 'Copy', 'Copied!');
        }

        function parseMarkdown(text, file, lines) {
            let html = text;
            const codeBlocks = [];
            html = html.replace(/```(\w+)?\n?([\s\S]*?)```/g, function (match, lang, code) {
                const content = code.replace(/^\n/, '').replace(/\n$/, '').trim();
                if (!content) return '';
                const fileInfo = (file || lines)
                    ? '<div class="cb-file-info">' + fileIconSVG + (file ? '<span class="cb-filename">' + esc(file) + '</span>' : '') + (lines ? '<span>· Lines ' + esc(lines) + '</span>' : '') + '</div>'
                    : '<div></div>';
                const toolbar = '<div class="cb-head">' + fileInfo + '<button class="cui-btn btn-transparent btn-xs" onclick="copyCode(this)" aria-label="Copy code">' + copyIconSVG + '<span>Copy</span></button></div>';
                codeBlocks.push('<div class="cui-code-block">' + toolbar + '<div class="cb-surface"><pre><code>' + esc(content) + '</code></pre></div></div>');
                return '___CODEBLOCK_' + (codeBlocks.length - 1) + '___';
            });
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/\n/g, '<br>');
            html = html.replace(/(<br\s*\/?>\s*)+___CODEBLOCK_/g, '___CODEBLOCK_');
            html = html.replace(/___CODEBLOCK_(\d+)___/g, function (match, index) {
                return codeBlocks[parseInt(index, 10)];
            });
            return html;
        }

        function renderResults() {
            const container = document.getElementById('results');
            if (!container) return;

            const base = findings.filter(function (f) {
                if (!matchesSearch(f)) return false;
                if (state.selectedSeverity !== 'all' && f.severity !== state.selectedSeverity) return false;
                if (state.selectedFile && f.file !== state.selectedFile) return false;
                return true;
            });
            const open = base.filter(function (f) { return !state.skipped[f.id]; });
            const skippedList = base.filter(function (f) { return !!state.skipped[f.id]; });
            const actionable = open.filter(function (f) { return f.severity === 'critical' || f.severity === 'major'; });
            const nitpicks = open.filter(function (f) { return f.severity === 'minor' || f.severity === 'trivial'; });

            const chips = [];
            if (state.selectedSeverity !== 'all') {
                chips.push('<button class="chip" onclick="handleSeverityFilter(\'all\')" title="Remove filter">' + xIconSVG + SEVERITY[state.selectedSeverity].label + '</button>');
            }
            if (state.selectedFile) {
                const name = state.selectedFile.slice(state.selectedFile.lastIndexOf('/') + 1);
                chips.push('<button class="chip" onclick="handleSelectFile(\'\')" title="Remove filter">' + xIconSVG + esc(name) + '</button>');
            }

            let groupsHtml = '';
            if (base.length === 0) {
                groupsHtml = EmptyState();
            } else {
                if (actionable.length > 0) {
                    groupsHtml += GroupHtml('actionable', state.actionableOpen, actionable.map(function (f) {
                        return FindingCard(f, findings.indexOf(f));
                    }).join(''));
                }
                if (nitpicks.length > 0) {
                    groupsHtml += GroupHtml('nitpicks', state.nitpicksOpen, nitpicks.map(function (f) {
                        return FindingCard(f, findings.indexOf(f));
                    }).join(''));
                }
                if (skippedList.length > 0) {
                    groupsHtml += GroupHtml('skipped', state.skippedOpen, skippedList.map(function (f) {
                        return FindingCard(f, findings.indexOf(f));
                    }).join(''));
                }
            }

            const totalText = open.length + (skippedList.length > 0 ? ' + ' + skippedList.length + ' skipped' : '');
            container.innerHTML =
                '<div class="findings-head">' +
                    icons.target +
                    '<h2 class="section-title">Findings</h2>' +
                    '<span class="results-total-badge">' + open.length + '</span>' +
                    '<span class="active-chips">' + chips.join('') + '</span>' +
                    '<span class="results-count">' + totalText + (open.length === 1 ? ' result' : ' results') + '</span>' +
                '</div>' +
                '<div class="filter-row">' +
                    '<span class="filter-label">Severity</span>' +
                    '<button class="cui-filter' + (state.selectedSeverity === 'all' ? ' active' : '') + '" onclick="handleSeverityFilter(\'all\')">Todos<span class="fp-count" data-count-sev="all">0</span></button>' +
                    ['critical', 'major', 'minor', 'trivial'].map(function (sev) {
                        return '<button class="cui-filter f-' + sev + (state.selectedSeverity === sev ? ' active' : '') + '" onclick="handleSeverityFilter(\'' + sev + '\')">' +
                            '<span class="cui-status-dot sm ' + (sev === 'critical' ? 'sd-danger' : sev === 'major' ? 'sd-accent' : sev === 'minor' ? 'sd-warn' : 'sd-neutral') + '"></span>' +
                            SEVERITY[sev].label +
                            '<span class="fp-count" data-count-sev="' + sev + '">0</span></button>';
                    }).join('') +
                '</div>' +
                groupsHtml;

            const counts = { all: open.length, critical: 0, major: 0, minor: 0, trivial: 0 };
            open.forEach(function (f) { counts[f.severity]++; });
            Object.keys(counts).forEach(function (sev) {
                const el = container.querySelector('[data-count-sev="' + sev + '"]');
                if (el) el.textContent = counts[sev];
            });
            const gAct = container.querySelector('[data-group-count="actionable"]');
            if (gAct) gAct.innerHTML = Badge(String(actionable.length), 'danger');
            const gNit = container.querySelector('[data-group-count="nitpicks"]');
            if (gNit) gNit.innerHTML = Badge(String(nitpicks.length), 'neutral');
            const gSkip = container.querySelector('[data-group-count="skipped"]');
            if (gSkip) gSkip.innerHTML = Badge(String(skippedList.length), 'neutral');
        }

        function render() {
            const app =
                '<div class="page-layout">' +
                    SideBar() +
                    '<div class="pl-main">' +
                        PageHeader() +
                        '<div class="pl-body cui-scrollbar">' +
                            '<div id="gate-zone"></div>' +
                            Hero() +
                            FileSelect() +
                            '<div id="results"></div>' +
                        '</div>' +
                        PageFooter() +
                    '</div>' +
                '</div>' +
                toastHtml();

            document.getElementById('root').innerHTML = app;
            renderResults();
            renderGate();
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.documentElement.setAttribute('data-theme', state.isDark ? 'dark' : 'light');
            render();
        });
    </script>
</body>
</html>
